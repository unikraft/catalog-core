
server.document-root = "/www"
server.bind         = "0.0.0.0"
server.port         = 80

# epoll backend provided by libposix-poll.
server.event-handler = "epoll"

# uncomment to enable mod_accesslog and log to stdout  
# server.modules = ( "mod_accesslog" )
# server.errorlog    = "/dev/stdout"
# accesslog.filename = "/dev/stdout"

index-file.names = ( "index.html" )

# Optional modules enabled by the catalog defconfigs:
#   mod_status  (default y)         - live server stats at /server-status
#   mod_expire  (default y)         - caching headers
#   mod_deflate (CONFIG_..._MOD_DEFLATE=y, via lib-zlib) - gzip responses
#   mod_rewrite (CONFIG_..._PCRE=y, via lib-pcre)        - PCRE URL rewriting
server.modules += ( "mod_status", "mod_expire", "mod_deflate", "mod_rewrite" )

status.status-url = "/server-status"
expire.url = ( "/" => "access plus 1 hours" )

deflate.mimetypes = ( "text/html", "text/plain", "text/css" )
deflate.allowed-encodings = ( "gzip" )
deflate.min-compress-size = 1

url.rewrite-once = ( "^/rewritten$" => "/index.html" )

# TLS / HTTPS (mod_openssl + lib-openssl). Listens on :443 alongside :80.
# Uncomment on builds with CONFIG_LIBLIGHTTPD_OPENSSL=y (currently x86 only,
# arm64 kernels do not compile lib-openssl and will fail to start with it).

# Anonymous MQTT on the default port. Add a password_file and drop
# allow_anonymous before using this on a shared network.

# Bound to 0.0.0.0 rather than left unset: without an address mosquitto also
# tries an AF_INET6 socket
listener 1883 0.0.0.0
allow_anonymous true
# Set to "none" to silence the broker. 
log_dest stdout
# /data/ lives in the in-memory root filesystem, so the database survives a
#  restart 
persistence true
persistence_location /data/

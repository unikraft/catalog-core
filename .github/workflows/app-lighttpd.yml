name: app-lighttpd

on:
  workflow_dispatch:
  push:
    paths:
      - 'lighttpd/**'
      - '.github/workflows/app-lighttpd.yml'

jobs:
  lighttpd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            qemu: qemu-system-x86
          - arch: arm64
            runner: ubuntu-26.04-arm
            qemu: qemu-system-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev libyaml-dev flex bison \
            git wget curl uuid-runtime \
            ${{ matrix.qemu }} libarchive-tools

      - name: Setup QEMU bridged networking
        run: bash .github/scripts/setup/qemu-setup.sh

      - name: Clone dependencies into repos/
        run: |
          test -d repos/unikraft      || git clone --depth 1 https://github.com/unikraft/unikraft repos/unikraft
          test -d repos/libs/lwip     || git clone --depth 1 https://github.com/unikraft/lib-lwip repos/libs/lwip
          test -d repos/libs/musl     || git clone --depth 1 https://github.com/unikraft/lib-musl repos/libs/musl
          test -d repos/libs/openssl  || git clone --depth 1 https://github.com/unikraft/lib-openssl repos/libs/openssl
          test -d repos/libs/zlib     || git clone --depth 1 https://github.com/unikraft/lib-zlib repos/libs/zlib
          test -d repos/libs/pcre     || git clone --depth 1 https://github.com/unikraft/lib-pcre repos/libs/pcre
          test -d repos/libs/lighttpd || git clone --depth 1 https://github.com/unikraft/lib-lighttpd repos/libs/lighttpd

      - name: Build and test lighttpd (${{ matrix.arch }})
        run: |
          cd lighttpd
          # qemu: build + run checks. fc: build only.
          ./.scripts/test/all.sh qemu.${{ matrix.arch }} | tee output.log
          ./.scripts/test/all.sh fc.${{ matrix.arch }}   | tee -a output.log
          if grep -q FAILED output.log; then exit 1; fi

      - name: Dump logs on failure
        if: failure()
        run: |
          for f in lighttpd/.scripts/test/log/*; do
            echo "===== $f ====="; cat "$f"; echo
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighttpd-test-logs-${{ matrix.arch }}
          path: lighttpd/.scripts/test/log/*
          retention-days: 7

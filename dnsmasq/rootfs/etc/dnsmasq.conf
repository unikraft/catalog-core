# dnsmasq as a validating, caching DNS forwarder on Unikraft.
# DNS only: DHCP and TFTP are compiled out

# Single process, no init, no fork().
no-daemon
log-facility=-

# Without this dnsmasq drops privileges, and the unikernel's
# getpwnam() only knows "root".
user=root

no-resolv                 # ignore /etc/resolv.conf; use server= below
domain-needed             # don't forward names without a dot
bogus-priv                # don't forward reverse lookups for private ranges
no-hosts                  # only use address= records below

listen-address=0.0.0.0
port=53
bind-interfaces
stop-dns-rebind           # reject upstream answers in the private ranges

cache-size=10000
dns-forward-max=1000
neg-ttl=60                # TTL for negative replies that arrive without an SOA

# all-servers races all three and takes the first reply: hides a slow or
# dropping resolver, costs 3x . Comment out to use one server
# and fall back to the others only on timeout.
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1
all-servers

# Trust anchors are baked into the image at pack time from the build host's
# dns-root-data (see .scripts/run/qemu.x86_64).
dnssec
conf-file=/etc/trust-anchors.conf
dnssec-check-unsigned     # prove unsigned zones are unsigned, not stripped

# Uncomment the following for logging to  console
#log-queries
#log-async=25

# Example record, also used by test.sh (.local is mDNS-reserved).
address=/test.local/172.44.0.2

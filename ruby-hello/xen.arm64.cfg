name          = "ruby-hello"
vcpus         = "1"
kernel        = "./workdir/build/ruby-hello_xen-arm64"
ramdisk       = "./initrd.cpio"
cmdline       = "ruby-hello_xen-arm64 vfs.fstab=[ \"initrd0:/:extract::ramfs=1:\" ] env.vars=[ RUBYLIB=\"/usr/local/lib/ruby/2.6.0:/usr/local/lib/ruby/2.6.0/aarch64-linux\" ] -- /app/helloworld.rb"
memory        = "256"
type          = "pv"

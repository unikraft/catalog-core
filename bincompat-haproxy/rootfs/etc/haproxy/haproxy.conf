global
    maxconn 200
    nbthread 1
    log stdout format raw local0 info
    nosplice

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:8080
    http-request return status 200 content-type text/plain string "Hello from HAProxy on Unikraft!\n"
